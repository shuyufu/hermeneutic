# Runs the aggregator and, via the `run-all` profile, its three client
# services too, on a single host. See README.md's "Building and running
# with Docker" section for the reasoning behind the two-target Dockerfile
# this builds from.

# Fixed project name: like the per-service `image:` names below, this
# keeps container names (e.g. "hermeneutic-aggregator-service-1") stable
# regardless of which directory the repo happens to be checked out into -
# Compose otherwise derives the project name from that directory.
name: hermeneutic

# Every service here builds from the same context/dockerfile, only
# `target:` differs, so that pair lives in one anchor instead of being
# repeated (and risking drift) in each service's own `build:` block.
x-build-base: &build-base
  context: .
  dockerfile: docker/Dockerfile

# Shared by every aggregator-client-* service below: one client_main.cpp
# binary, three concurrent invocations distinguished only by `command:`
# (bbo/volume-bands/price-bands can't share a single Compose service - each
# needs its own container and its own long-running foreground process).
# Each is a real service, not a diagnostic extra - `profiles: ["run-all"]`
# below isn't "opt-in/best-effort", it's this compose file's explicit,
# named way to bring up the whole stack on one host in one command
# (`docker compose --profile run-all up`), as opposed to `docker compose
# up` alone, which starts only aggregator-service.
x-client-base: &client-base
  build:
    <<: *build-base
    target: client
  depends_on:
    aggregator-service:
      condition: service_healthy
  profiles: ["run-all"]
  # client_main.cpp never resubscribes on a book_seq GAP or a
  # server-ended stream - it deliberately just stops that book's thread
  # and, once every book it was given has stopped, exits (see the "GAP:"
  # comment in client_main.cpp) - "an operator's signal to restart it".
  # `unless-stopped` is that restart, automated, instead of left to a
  # human watching stdout.
  restart: unless-stopped
  # client_main.cpp installs no SIGTERM handler of its own. As each
  # container's PID 1, the kernel gives it no default disposition for
  # SIGTERM either, so without `init:` a plain `docker compose down`
  # would have to wait out the full stop_grace_period and SIGKILL every
  # client. `init: true` runs tini as PID 1 instead, which does apply
  # SIGTERM's normal terminate-immediately default to its child.
  init: true

services:
  aggregator-service:
    # Named explicitly rather than left to Compose's default
    # <project>-<service> tag (which takes <project> from whatever
    # directory the compose file happens to be run from - a worktree
    # checkout named e.g. "docker-deploy" would otherwise tag this
    # "docker-deploy-aggregator-service"): a fixed name here is stable
    # regardless of where the repo is checked out.
    image: aggregator-service
    build:
      <<: *build-base
      target: service
    ports:
      - "50051:50051"
    volumes:
      # The image bakes in no config of its own (see docker/Dockerfile) -
      # this mount is what makes `docker compose up` actually work.
      # Defaults to the repo's worked example; point this at your own
      # config to change which books/venues get ingested (see
      # apps/aggregator/subscriptions.example.json and
      # bobby/hermeneutic/ingestion/book_subscription.hpp for the shape).
      - ./apps/aggregator/subscriptions.example.json:/etc/hermeneutic/subscriptions.json:ro
    restart: unless-stopped
    # A policy choice, not a computed bound - no finite number can be,
    # since server_main.cpp's own comment on kGrpcShutdownDeadline
    # explains that a genuinely wedged gRPC shutdown can hang past its
    # deadline. 45s = kGrpcShutdownDeadline (5s) + kShutdownTimeout (35s)
    # + margin: long enough that the *existing* in-process
    # shutdown_watchdog backstop gets a real chance to fire before Docker
    # would otherwise SIGKILL out from under it (at Compose's 10s
    # default, that 35s watchdog can never fire at all - dead code in
    # this exact deployment). A shutdown that's still stuck past 45s
    # terminates by SIGKILL, by design, same as an operator's second
    # Ctrl-C/SIGTERM would force via std::_Exit() on the host.
    stop_grace_period: 45s
    # A plain TCP-connect check, not a real gRPC health check: good enough
    # to know the listener is up (grpc::ServerBuilder::BuildAndStart()
    # returns, and binds the port, well before server_main.cpp's ingestion
    # setup or server->Wait()), which is all aggregator-client's
    # depends_on below needs - the client's own SubscribeBbo call doesn't
    # set wait_for_ready, so without this it can race the listener and
    # fail fast with UNAVAILABLE instead of actually connecting.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/50051' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Three client services (apps/aggregator/client_main.cpp), one per view -
  # `docker compose --profile run-all up` starts all three alongside
  # aggregator-service. Each is
  # `<address> <bbo|volume-bands|price-bands> [--volume-thresholds=...]
  # [--price-bps=...] <duration_seconds> <book...>` - see client_main.cpp's
  # print_usage() (and the per-service comments below, for the two
  # band-override flags specifically).
  aggregator-client-bbo:
    <<: *client-base
    image: aggregator-client-bbo
    command: ["aggregator-service:50051", "bbo", "0", "BTC_USDT.SPOT", "BTC_USDT.PERP"]

  # To use custom notional thresholds instead of client_main.cpp's default
  # 1M/5M/10M/25M/50M+, add a "--volume-thresholds=<n1,n2,...>" element to
  # the command: list below - client_main.cpp accepts it anywhere on the
  # command line (see its print_usage() for the exact syntax), e.g.
  # (2M/10M/20M/50M/100M+, a genuinely different set from the default
  # above, not just the default repeated):
  #   command: ["aggregator-service:50051", "volume-bands", "0",
  #             "--volume-thresholds=2000000,10000000,20000000,50000000,100000000",
  #             "BTC_USDT.SPOT"]
  aggregator-client-volume-bands:
    <<: *client-base
    image: aggregator-client-volume-bands
    command: ["aggregator-service:50051", "volume-bands", "0", "BTC_USDT.SPOT"]

  # Same idea for price-bands' bps thresholds, via "--price-bps=<b1,b2,...>"
  # in place of client_main.cpp's default 50bps/100bps/200bps/500bps/1000bps+.
  aggregator-client-price-bands:
    <<: *client-base
    image: aggregator-client-price-bands
    command: ["aggregator-service:50051", "price-bands", "0", "BTC_USDT.SPOT"]
