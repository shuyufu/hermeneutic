syntax = "proto3";

package bobby.hermeneutic.aggregator;

// SubscribeL2Diff streams the current aggregated L2 order book (as an
// initial snapshot) followed by every subsequent change, until the client
// cancels.
//
// SubscribeBbo streams the current best bid/ask (as an initial value)
// followed by a new value whenever the published best bid or best ask
// changes. A client that only cares about the top of book can use this
// instead of SubscribeL2Diff and never has to parse an L2Diff message.
//
// The two are independent gRPC streams (independent lifecycle, independent
// backpressure) even though they observe the same underlying aggregate book
// - see Bbo.book_seq for how they correlate.
//
// ListBooks returns the fixed, immutable set of books this server instance
// was started with - the same set SubscribeL2DiffRequest/SubscribeBboRequest
// validate their own `book` field against.
service Aggregator {
  rpc SubscribeL2Diff(SubscribeL2DiffRequest) returns (stream L2Update);
  rpc SubscribeBbo(SubscribeBboRequest) returns (stream BboUpdate);
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
}

// Which market a book covers. MARKET_TYPE_UNSPECIFIED is proto3's implicit
// zero value on an unset field, never a valid book - a request that leaves
// this unset (or a base/quote left empty) is malformed, distinct from a
// well-formed BookId that just doesn't match any book this server was
// started with (see BookId's own comment and the two RPCs below).
enum MarketType {
  MARKET_TYPE_UNSPECIFIED = 0;
  SPOT = 1;
  PERP = 2;
}

// A book's identity as a structured value, not a string a client has to
// spell correctly: base and quote are carried as their own fields, so
// "which currency is which" is never something a server or client has to
// parse back out of a concatenated symbol - see
// bobby::hermeneutic::symbol::BookId (symbol.hpp) for the equivalent C++
// type. base/quote are this project's own asset codes (e.g. "BTC"/"USDT"),
// not a venue-native spelling.
message BookId {
  string base = 1;
  string quote = 2;
  MarketType market = 3;
}

message SubscribeL2DiffRequest {
  // Must match one of the books this server instance was started with (a
  // fixed, immutable set - see AggregatorService's constructor). A
  // malformed BookId (MARKET_TYPE_UNSPECIFIED, or an empty base/quote)
  // fails with INVALID_ARGUMENT; a well-formed one that just isn't one of
  // this server's books fails with NOT_FOUND - so a typo'd book is loud
  // either way, never a silently empty stream.
  BookId book = 1;
}

message SubscribeBboRequest {
  // Same contract as SubscribeL2DiffRequest.book.
  BookId book = 1;
}

message ListBooksRequest {}

message ListBooksResponse {
  // Every book this server instance was started with. Order is not
  // guaranteed to be stable across calls or across server restarts.
  repeated BookId books = 1;
}

// Fixed-point encoding, fixed by this protocol (not configurable per
// subscription - see bobby::hermeneutic::Price/Size in fixed_point.hpp):
//   price = price_raw / 1e9
//   size  = size_raw  / 1e6
//
// In L2Snapshot.bids/asks, size_raw is always > 0.
//
// In L2Diff.bids/asks, a level is a replacement, not a delta: size_raw > 0
// replaces the aggregate size at price_raw with size_raw (the resulting
// absolute size, never something to add to a previous value); size_raw == 0
// removes the level entirely.
//
// Bbo.bid/Bbo.ask carry the same encoding and are always the resulting
// absolute size too (Bbo is never a delta - see Bbo's own comment).
message PriceLevel {
  int64 price_raw = 1;
  int64 size_raw = 2;
}

message L2Snapshot {
  // book_seq is the monotonically increasing revision of the aggregate
  // order book itself (not merely a stream-local sequence number).
  //
  // A snapshot with book_seq=N represents the complete book state after
  // revision N. On this stream (SubscribeL2Diff), the next observable
  // update is guaranteed to have book_seq=N+1: every aggregate-book
  // revision produces exactly one L2Diff here, so book_seq is contiguous.
  //
  // Clients that observe a gap in book_seq on this stream must discard
  // their local book and resubscribe for a new snapshot - a gap means a
  // revision's diff was never received, so the locally reconstructed book
  // is no longer valid.
  uint64 book_seq = 1;
  // Unix epoch timestamp in nanoseconds, captured by the aggregator's own
  // wall clock when this update is published. It is not an exchange/source
  // timestamp, an upstream-receive timestamp, or a book-mutation timestamp -
  // only when the aggregator built this outbound message.
  //
  // For observability (e.g. latency measurement) only - never for ordering.
  // Wall-clock time is not monotonic (NTP sync, manual clock changes can
  // make it jump backward); book_seq is what establishes order and gaps.
  //
  // fixed64, not int64/uint64: a current epoch-nanos value is large enough
  // (~61 bits) that varint encoding needs 9 bytes, one more than fixed64's
  // constant 8 - same choice OpenTelemetry's *_unix_nano fields make.
  fixed64 ts_ns = 2;
  // Sorted best-to-worst (descending by price).
  repeated PriceLevel bids = 3;
  // Sorted best-to-worst (ascending by price).
  repeated PriceLevel asks = 4;
}

message L2Diff {
  // Same aggregate-book revision domain as L2Snapshot.book_seq. On this
  // stream (SubscribeL2Diff), book_seq must be contiguous: a gap means a
  // revision was missed and the locally reconstructed book is invalid -
  // resubscribe for a fresh snapshot. (Contrast with Bbo.book_seq on the
  // SubscribeBbo stream, where gaps are normal - see Bbo's comment.)
  uint64 book_seq = 1;
  // See L2Snapshot.ts_ns: same semantics (aggregator publish time, not for
  // ordering) and same fixed64 rationale.
  fixed64 ts_ns = 2;
  // Same ordering guarantee as L2Snapshot.bids (descending by price) - this
  // falls out of the aggregate book's own ordering by construction, not a
  // separate sort step, so it costs nothing extra to guarantee.
  repeated PriceLevel bids = 3;
  // Same ordering guarantee as L2Snapshot.asks (ascending by price).
  repeated PriceLevel asks = 4;
}

// The complete current best bid/ask state - never a delta, and never
// dependent on a previously received Bbo for reconstruction. Sent as the
// first message on a SubscribeBbo stream, then again whenever the published
// best bid or best ask changes.
message Bbo {
  // Same aggregate-book revision domain as L2Snapshot.book_seq/L2Diff.book_seq
  // - this is the revision of the aggregate book that produced this BBO
  // state, which is what lets a client correlate a Bbo message against the
  // L2Diff stream (or a recording of it) even though SubscribeBbo and
  // SubscribeL2Diff are independent gRPC streams with no guaranteed arrival
  // order relative to each other.
  //
  // Unlike on the SubscribeL2Diff stream, book_seq here is monotonically
  // increasing but NOT required to be contiguous: most aggregate-book
  // revisions only touch levels away from the top of book and therefore
  // never produce a Bbo message at all. A gap in book_seq on this stream is
  // expected and does NOT imply a missed message - every Bbo actually
  // delivered is, by construction, the complete and correct state as of the
  // book_seq it carries.
  uint64 book_seq = 1;
  // See L2Snapshot.ts_ns: same semantics (aggregator publish time, not for
  // ordering) and same fixed64 rationale.
  fixed64 ts_ns = 2;
  // Absent (has_bid() == false) if the aggregate book currently has no bid.
  // Never represented with a sentinel price or a zero size.
  PriceLevel bid = 3;
  // Absent (has_ask() == false) if the aggregate book currently has no ask.
  PriceLevel ask = 4;
}

// Liveness signal, sent on a fixed interval independent of any book change -
// so a client that has seen nothing for a while can tell "book genuinely
// unchanged" apart from "aggregator/feed stalled" (a client would otherwise
// have no way to distinguish those from a quiet stream alone). No book_seq:
// a heartbeat is not a book revision and must never advance the book_seq
// sequence L2Snapshot/L2Diff/Bbo participate in. ts_ns has the same
// semantics as L2Snapshot.ts_ns (aggregator wall-clock publish time,
// observability only).
//
// The same Heartbeat message is reused on both L2Update and BboUpdate;
// heartbeats are still logically per-stream (a SubscribeL2Diff heartbeat
// says nothing about SubscribeBbo's liveness or vice versa) since each is
// carried on its own independent gRPC/HTTP2 stream.
message Heartbeat {
  fixed64 ts_ns = 1;
  // Which venues are currently contributing to this book, as venue-native
  // display strings (see bobby::hermeneutic::symbol::to_string(VenueId),
  // e.g. "binance_spot", "okx_swap") - not a structured VenueId, since
  // nothing parses this back (same reasoning as BookId's own to_string()).
  // Empty means no venue currently backs this book - the strongest signal
  // a client has that this book is not trustworthy right now, whether the
  // cause is a disconnect, a resync gap, a failed initial snapshot fetch,
  // or the book never having been seeded yet; this field is intentionally
  // cause-agnostic, since the corrective action - distrust this book - is
  // the same regardless of cause. A shrinking-but-non-empty set means the
  // book is thinner, not invalid; clients already see exactly how much
  // thinner via the ordinary L2Diff/Bbo updates invalidate_venue() itself
  // produces, so this field only has to answer "is this still backed at
  // all", not "by how much".
  //
  // Element order is unspecified and may change between heartbeats even
  // when the live venue set itself hasn't (the server populates this by
  // iterating an unordered_map) - a client comparing successive heartbeats
  // should treat this as a set, not a sequence.
  //
  // proto3 gives repeated fields no wire-level presence distinction
  // between "never set" and "explicitly empty" - both look identical to a
  // client. Practically: an AggregatorService build predating this field
  // (or one rolled back mid-incident) simply never populates it, which a
  // client relying on the "empty = untrustworthy" contract above cannot
  // tell apart from a genuinely live book with zero contributing venues.
  // Not fixed here - would need either a sentinel field marking this
  // server build as live_venues-aware, or accepting that mixed-version
  // rolling deploys are out of scope for this signal for now.
  //
  // Known blind spot a client should be aware of: a venue listed here as
  // live only means the WebSocket idle-ping mechanism that keeps it
  // connected got *some* response - if that venue sits behind a load
  // balancer/reverse proxy that answers protocol-level pings independently
  // of its own backend's health (a common, cheap-to-terminate-at-the-edge
  // setup), this field can report a venue as live indefinitely with no
  // real market data ever arriving again. Not detectable from this field
  // alone - see include/bobby/hermeneutic/net/websocket_connection.hpp's
  // connect() for the full reasoning.
  repeated string live_venues = 2;
}

message L2Update {
  oneof update {
    L2Snapshot snapshot = 1;
    L2Diff diff = 2;
    Heartbeat heartbeat = 3;
  }
}

message BboUpdate {
  oneof update {
    Bbo bbo = 1;
    Heartbeat heartbeat = 2;
  }
}
